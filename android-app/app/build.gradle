plugins { id 'com.android.application' }

android {
    namespace 'com.fincontrolpro.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fincontrolpro.app'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug { }
        release {
            minifyEnabled false
            // Configure seu keystore fora do repositório para publicar na Play Store.
        }
    }
}
